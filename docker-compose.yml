name: flutter-template

services:
  app:
    image: ${DOCKERHUB_USERNAME:-alihaidar199527}/flutter-devcontainer:latest
    container_name: flutter_app
    restart: "no"
    entrypoint: ["/workspace/scripts/entrypoint.dev.sh"]
    command: sleep infinity
    volumes:
      # ── Project files ──────────────────────────────────────────────────────
      # :cached = host is the source of truth; Docker can cache reads on macOS.
      - .:/workspace:cached

      # ── Git identity ───────────────────────────────────────────────────────
      - ${USERPROFILE:-$HOME}/.gitconfig:/home/developer/.gitconfig:ro

      # ── SSH keys ───────────────────────────────────────────────────────────
      # :cached = permissions fixed at runtime by entrypoint.dev.sh
      # Windows NTFS mounts SSH keys with incorrect permissions (0777).
      # The entrypoint script corrects them to 600/644 on every container start.
      - ${USERPROFILE:-$HOME}/.ssh:/home/developer/.ssh:cached

      # ── Dart / Flutter caches ──────────────────────────────────────────────
      # Persisted as named volumes so pub packages and Gradle artifacts survive
      # container rebuilds. Without these, every restart re-downloads all deps.
      - pub-cache:/home/developer/.pub-cache
      - gradle-cache:/home/developer/.gradle

      # ── Android SDK ────────────────────────────────────────────────────────
      # Persisted so the Android SDK installed in the image is not lost
      # when the container is recreated.
      - android-sdk:/home/developer/Android

      # ── Shell history ─────────────────────────────────────────────────────
      - shell-history:/home/developer/.shell_history

    environment:
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"

      # NOTE: no ADB_SERVER_SOCKET here — see "Host emulator (ADB)" below.

    ports:
      # flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0
      - "8080:8080"

    # ── Host emulator (ADB) ─────────────────────────────────────────────────
    # The container runs its OWN local adb server (the default — no
    # ADB_SERVER_SOCKET override) and connects OUT to the emulator running on
    # the Windows host via `adb connect host.docker.internal:5555`.
    #
    # An earlier version of this file pointed the container's adb CLIENT at
    # the host's adb SERVER instead (ADB_SERVER_SOCKET=tcp:host.docker.internal:5037).
    # That relayed every adb command to the host correctly, but it also meant
    # every `adb forward` — which is exactly how Flutter's VM Service
    # (hot reload / hot restart) connection is established — got bound on the
    # HOST's own loopback interface, not the container's. `flutter run` inside
    # the container had no way to reach that forwarded port, so the app would
    # install and launch fine but hot reload/restart would hang forever on
    # "Connecting to the VM Service...".
    #
    # With the adb server running locally in the container instead, any port
    # it forwards is on the container's own localhost — directly reachable by
    # `flutter run`, which also runs in the container. See "Connecting to a
    # Host Emulator" in README.md for full setup steps.
    #
    # host.docker.internal is resolved via the extra_hosts entry below.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    working_dir: /workspace

    networks:
      - flutter-network

volumes:
  pub-cache:
  gradle-cache:
  android-sdk:
  shell-history:

networks:
  flutter-network:
    driver: bridge
