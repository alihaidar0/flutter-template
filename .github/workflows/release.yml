# .github/workflows/release.yml
#
# Publishes a GitHub Release when a promotion into main changes the template
# itself (documentation-only promotions do not release). Releases use calendar
# versions (vYYYY.MM.DD, then vYYYY.MM.DD.1, ...) because the template has no
# API to version semantically; the tag tells a project which state of the
# template it was created from.
#
# This workflow is copied into every generated project, where it must never run
# (an application repository has its own release process), so the job only runs
# in the template repository.
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Publish GitHub Release
    if: github.event.repository.is_template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done
          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"
