# .github/workflows/release.yml
#
# Template repository only: publishes a GitHub Release with automatically
# generated release notes (grouped by pull-request label, see
# .github/release.yml) when a promotion lands on main, with a calendar version
# (vYYYY.MM.DD, then vYYYY.MM.DD.1, ...). Documentation-only promotions do not
# release. The tag tells a project which state of the template it was created
# from. The Releases page is the changelog; nothing is committed back to a
# protected branch, so no bot, token or extra pull request is involved.
#
# A generated project does not use this file: its releases are the draft
# releases of build.yml (the release-draft job), which carry the signed files and
# are published by hand (docs/environments.md). The job below never runs there, so
# the file can be deleted from a project.
#
# Tags matching v* are immutable (see the tags-protect ruleset).
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Publish GitHub Release
    if: github.event.repository.is_template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done
          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"
