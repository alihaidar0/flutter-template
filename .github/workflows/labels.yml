# .github/workflows/labels.yml
#
# Keeps the repository's labels identical to .github/labels.yml (labels as code).
# Runs when that file changes on main, or on demand for the first-time bootstrap.
# Labels not listed in the file are left alone.
name: Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

concurrency:
  group: labels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels to GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          persist-credentials: false

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
