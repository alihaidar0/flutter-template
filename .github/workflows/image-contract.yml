# .github/workflows/image-contract.yml
#
# Weekly check that the template still matches what the flutter-devcontainer
# image provides (pnpm and Node versions, the image the compose file pulls, the
# documented shell aliases), and that the actionlint and zizmor versions pinned
# in ci.yml are not behind a release that is at least 7 days old. A red run means
# one of the two repositories moved on; it is deliberately not part of the
# required "CI passed" check, because it depends on another repository's state.
# A failed scheduled run opens or updates the issue "Weekly image contract check
# failed".
#
# Runs only in the template repository, never in a generated project.
name: Image contract

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs.
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Check against flutter-devcontainer
    if: github.event.repository.is_template
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the image's published sources
        run: bash .github/scripts/check-image-contract.sh

      - name: Check that the linter versions CI pins are current
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-tool-versions.sh

  # A scheduled run has no pull request and no author to notify, so a failure would
  # only show as a red run in the Actions tab. Keep one open issue instead; each new
  # failure comments on it. Close it once a weekly run is green again.
  report-failure:
    name: Report a failed weekly run
    needs: contract
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write   # open the tracking issue, or comment on it
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly image contract check failed"
        run: |
          body="The weekly Image contract run failed: ${RUN_URL}"
          body="${body}"$'\n\n'"Open the run, fix the cause on a topic branch (or merge the pending Dependabot pull request that fixes it), then close this issue."
          number="$(gh issue list --state open --label bug --limit 100 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --label bug --body "$body"
            echo "Opened the tracking issue" >> "$GITHUB_STEP_SUMMARY"
          fi
