version: 2
updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "develop"
    rebase-strategy: "auto"
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # ── Dart / Flutter pub packages ─────────────────────────────────────────────
  # DISABLED on flutter-template itself. This ecosystem requires pubspec.yaml
  # to exist at the repo root — which this template intentionally does not
  # ship (see README: "Blank canvas. No lib/, no pubspec.yaml"). Left enabled,
  # Dependabot hard-fails every run with "dependency_file_not_found" since it
  # has no graceful-skip behavior like ci.yml's tier detection does.
  #
  # ACTION REQUIRED once you run `flutter create` in a project generated from
  # this template: uncomment the block below so dependency updates actually
  # run. See README → Dependabot section.
  #
  # - package-ecosystem: "pub"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "09:00"
  #     timezone: "UTC"
  #   target-branch: "develop"
  #   rebase-strategy: "auto"
  #   assignees:
  #     - "alihaidar0"
  #   commit-message:
  #     prefix: "chore"
  #     include: "scope"
  #   labels:
  #     - "dependencies"
  #     - "flutter"
  #   open-pull-requests-limit: 5

  # ── npm (husky + commitlint only) ───────────────────────────────────────────
  # Node is intentionally frozen at v24 LTS — matches the pinned NODE_VERSION
  # in flutter-devcontainer's Dockerfile.dev. All other npm packages are
  # auto-updated. Bump Node manually (in both repos) when v26 LTS ships.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "develop"
    rebase-strategy: "auto"
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # Node version is frozen at 24 LTS — do not bump automatically.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
      npm-all:
        patterns:
          - "*"
        exclude-patterns:
          - "@commitlint/*"
    open-pull-requests-limit: 5
